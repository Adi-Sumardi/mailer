services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sendagomail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [sendagomail]

  auth-service:
    build: ../services/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sendagomail:${POSTGRES_PASSWORD}@postgres:5432/auth?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_DAYS: 30
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MAIL_APP_SERVICE_URL: http://mail-app-service:3002
      DOMAIN_PROVISIONING_SERVICE_URL: http://domain-provisioning:3001
      PORT: 3000
    depends_on: [postgres]
    ports: ["18000:3000"]
    networks: [sendagomail]

  domain-provisioning:
    build: ../services/domain-provisioning
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sendagomail:${POSTGRES_PASSWORD}@postgres:5432/domain_provisioning?schema=public
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # DKIM lewat modul Rspamd `dkim_signing` (live-reload otomatis via changedetector bawaan
      # docker-mailserver) — BUKAN OpenDKIM klasik lagi, yang config-nya cuma ke-load sekali
      # saat container mailserver start (domain baru butuh restart penuh mail-engine supaya
      # aktif, celah yang sempat bikin tenant baru gagal kirim tanpa ada yang sadar).
      DKIM_KEYS_DIR: /app/rspamd/dkim
      DKIM_OVERRIDE_DIR: /app/rspamd/override.d
      DOMAIN_VERIFICATION_TXT_PREFIX: sendagomail-verify
      MAIL_ENGINE_MX_HOST: mail.adilabs.id
      MAIL_ENGINE_MX_PRIORITY: 10
      OUTBOUND_RELAY_IP: ${OUTBOUND_RELAY_IP}
      PORT: 3001
    volumes:
      # Bind mount LANGSUNG ke direktori host yang dibaca mail-engine (project compose
      # TERPISAH, lihat mail-engine/docker-compose.yml: ./config/:/tmp/docker-mailserver/).
      - ../mail-engine/config/rspamd:/app/rspamd
    depends_on: [postgres]
    ports: ["18001:3001"]
    networks: [sendagomail]

  mail-app-service:
    build: ../services/mail-app-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sendagomail:${POSTGRES_PASSWORD}@postgres:5432/mail_app?schema=public
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DEFAULT_RECALL_WINDOW_SECONDS: 5
      MAX_ATTACHMENT_SIZE_KB: 25600
      AUTH_SERVICE_URL: http://auth-service:3000
      PORT: 3002
      # mail-engine (Postfix) berjalan sebagai docker-compose project TERPISAH di host yang
      # sama, port-nya di-publish ke host — dijangkau lewat host.docker.internal, bukan nama
      # container (beda network compose).
      SMTP_HOST: host.docker.internal
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TEMPLATE_LOGOS_DIR: /app/template-logos
    volumes:
      # Logo template branding per mailbox — named volume, persist lintas rebuild/redeploy.
      - template-logos:/app/template-logos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [postgres]
    ports: ["18002:3002"]
    networks: [sendagomail]

  calendar-task-service:
    build: ../services/calendar-task-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sendagomail:${POSTGRES_PASSWORD}@postgres:5432/calendar_task?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3003
    depends_on: [postgres]
    ports: ["18003:3003"]
    networks: [sendagomail]

  automation-engine:
    build: ../services/automation-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sendagomail:${POSTGRES_PASSWORD}@postgres:5432/automation?schema=public
      JWT_SECRET: ${JWT_SECRET}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET}
      PORT: 3004
    depends_on: [postgres]
    ports: ["18004:3004"]
    networks: [sendagomail]

  api-gateway:
    build: ../services/api-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3000
      DOMAIN_PROVISIONING_SERVICE_URL: http://domain-provisioning:3001
      MAIL_APP_SERVICE_URL: http://mail-app-service:3002
      CALENDAR_TASK_SERVICE_URL: http://calendar-task-service:3003
      AUTOMATION_ENGINE_URL: http://automation-engine:3004
      CORS_ORIGIN: https://sendagomail.adilabs.id
      RATE_LIMIT_MAX: 300
    depends_on:
      - auth-service
      - domain-provisioning
      - mail-app-service
      - calendar-task-service
      - automation-engine
    ports: ["18080:8080"]
    networks: [sendagomail]

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_GATEWAY_URL: ""
    restart: unless-stopped
    ports: ["18090:80"]
    networks: [sendagomail]

networks:
  sendagomail:
    name: sendagomail-network

volumes:
  pgdata:
  template-logos:
