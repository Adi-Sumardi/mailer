server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router menangani routing di client, jadi semua path
    # yang bukan file statis harus jatuh ke index.html, bukan 404 dari nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
