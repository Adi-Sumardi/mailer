<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col justify-center"><main class="w-full max-w-md mx-auto p-margin-mobile"><div class="flex flex-col w-full">
<!-- Brand Accents: Animated Background Element -->
<div class="fixed inset-0 overflow-hidden pointer-events-none opacity-20">
<svg class="absolute -top-24 -right-24 w-[600px] h-[600px] text-surface-container" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<path d="M44.7,-76.4C58.1,-69.2,69.2,-58.1,77.3,-44.7C85.4,-31.3,90.5,-15.7,89.2,-0.7C88,14.2,80.4,28.5,70.9,40.5C61.4,52.5,50,62.3,37.2,70.3C24.4,78.3,10.2,84.5,-4.4,92.1C-18.9,99.7,-37.8,108.6,-52.1,102.6C-66.4,96.6,-76.1,75.7,-82.9,57.7C-89.7,39.7,-93.6,24.6,-93.4,9.6C-93.2,-5.4,-88.9,-20.3,-81.4,-33.7C-73.9,-47.1,-63.2,-59,-50.4,-66.6C-37.6,-74.2,-22.7,-77.5,-7.2,-81.6C8.3,-85.7,21.3,-83.6,44.7,-76.4Z" fill="currentColor" transform="translate(100 100)"></path>
</svg>
</div>
<!-- Main Registration Card -->
<div class="relative z-10 w-full bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden">
<!-- Header Progress Line -->
<div class="h-1.5 w-full bg-surface-container flex">
<div class="h-full bg-primary transition-all duration-500 ease-out" id="progress-bar" style="width: 33%"></div>
</div>
<div class="p-stack-xl">
<!-- Typography Header -->
<div class="flex flex-col gap-stack-xs mb-stack-xl">
<div class="flex items-center gap-stack-sm text-primary">
<span class="material-symbols-outlined font-headline-md">alternate_email</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Infrastructure Access</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">Deploy your first node.</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join 10,000+ developers scaling their transactional delivery.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-lg" id="registration-form">
<!-- Full Name -->
<div class="flex flex-col gap-stack-sm group">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="full-name">Legal Name</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 font-body-md text-body-md focus:ring-2 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="full-name" name="full-name" placeholder="Alex Sterling" required="" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">person</span>
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-stack-sm group">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="email">Professional Email</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 font-body-md text-body-md focus:ring-2 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="alex@company.io" required="" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">mail</span>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-stack-sm group">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="password">Master Password</label>
<span class="text-[10px] font-label-caps uppercase text-outline-variant" id="password-strength">Security: Weak</span>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 font-code-sm text-code-sm focus:ring-2 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Terms Toggle -->
<div class="flex items-start gap-stack-md mt-stack-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded text-primary focus:ring-primary bg-surface-container-low border-outline-variant cursor-pointer" id="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
            I agree to the <a class="text-primary hover:underline" href="#">Service Level Agreement</a> and <a class="text-primary hover:underline" href="#">Data Processing Addendum</a>.
          </label>
</div>
<!-- Submit Button -->
<button class="group relative w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-lg shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all overflow-hidden" type="submit">
<div class="relative z-10 flex items-center justify-center gap-stack-md">
<span>Create Account</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</div>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
</button>
</form>
<!-- Footer Actions -->
<div class="mt-stack-xl pt-stack-lg border-t border-surface-container flex flex-col items-center gap-stack-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
          Already have an account?
          <a class="font-label-caps text-label-caps text-primary hover:text-on-primary-fixed-variant ml-1 transition-colors underline decoration-primary/30 underline-offset-4" href="/login">Sign In</a>
</p>
<div class="flex items-center gap-stack-lg grayscale opacity-40">
<span class="font-label-caps text-[10px]">SOC2 TYPE II</span>
<span class="font-label-caps text-[10px]">GDPR COMPLIANT</span>
<span class="font-label-caps text-[10px]">ISO 27001</span>
</div>
</div>
</div>
</div>
<!-- Decorative Status Counter -->
<div class="mt-stack-lg flex justify-between px-2">
<div class="flex flex-col">
<span class="font-label-caps text-[10px] text-outline">Network Latency</span>
<span class="font-code-sm text-code-sm text-secondary">14ms Global</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-caps text-[10px] text-outline">Uptime Status</span>
<div class="flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
<span class="font-code-sm text-code-sm text-secondary">99.99% Operational</span>
</div>
</div>
</div>
<script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerText = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerText = 'visibility';
      }
    }

    // Dynamic UI logic
    const inputs = document.querySelectorAll('input');
    const progressBar = document.getElementById('progress-bar');
    const strengthLabel = document.getElementById('password-strength');

    inputs.forEach(input => {
      input.addEventListener('input', () => {
        const filled = Array.from(inputs).filter(i => i.value.length > 0).length;
        const percent = Math.max(33, (filled / inputs.length) * 100);
        progressBar.style.width = `${percent}%`;

        if (input.id === 'password') {
          const val = input.value;
          if (val.length === 0) {
            strengthLabel.innerText = 'Security: Weak';
            strengthLabel.className = 'text-[10px] font-label-caps uppercase text-outline-variant';
          } else if (val.length < 8) {
            strengthLabel.innerText = 'Security: Vulnerable';
            strengthLabel.className = 'text-[10px] font-label-caps uppercase text-primary';
          } else {
            strengthLabel.innerText = 'Security: Hardened';
            strengthLabel.className = 'text-[10px] font-label-caps uppercase text-green-600';
          }
        }
      });
    });

    document.getElementById('registration-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span><span>Provisioning...</span>`;
      
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span><span>Account Ready</span>`;
        btn.className = btn.className.replace('bg-primary', 'bg-green-600');
      }, 1500);
    });
  </script>
</div></main></body></html>
