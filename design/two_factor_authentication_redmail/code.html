"stack-sm":"8px","container-max":"1280px","stack-md":"16px","gutter":"24px"},"fontFamily":{"body-md":["Inter"],"label-caps":["Inter"],"body-sm":["Inter"],"code-sm":["JetBrains Mono"],"headline-xl":["Inter"],"headline-lg":["Inter"],"headline-xl-mobile":["Inter"],"body-lg":["Inter"],"headline-md":["Inter"]},"fontSize":{"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"label-caps":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"code-sm":["13px",{"lineHeight":"20px","fontWeight":"450"}],"headline-xl":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-lg":["30px",{"lineHeight":"38px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-xl-mobile":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}]}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col justify-center"><main class="w-full max-w-md mx-auto p-margin-mobile"><div class="flex flex-col w-full">
<!-- Content Container -->
<div class="relative overflow-hidden bg-surface-container-lowest rounded-xl shadow-xl p-8 md:p-12">
<!-- Decorative Background Element -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-secondary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-center">
<!-- Security Icon Badge -->
<div class="mb-stack-xl relative">
<div class="absolute inset-0 bg-primary/10 rounded-full animate-ping opacity-25"></div>
<div class="relative w-20 h-20 bg-primary flex items-center justify-center rounded-full shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
</div>
<!-- Header -->
<div class="mb-stack-lg">
<h2 class="font-headline-xl text-on-surface mb-stack-xs">Secure Verification</h2>
<p class="font-body-md text-on-surface-variant max-w-sm">
          We've sent a 6-digit authentication code to your registered device ending in <span class="font-bold text-on-surface">•••• 4829</span>
</p>
</div>
<!-- OTP Input Section -->
<form class="w-full max-w-sm space-y-stack-lg" id="otp-form">
<div class="flex justify-between gap-2 md:gap-3" id="otp-container">
<input autocomplete="one-time-code" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-primary bg-surface-container border-none rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all duration-200" data-index="0" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-primary bg-surface-container border-none rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all duration-200" data-index="1" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-primary bg-surface-container border-none rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all duration-200" data-index="2" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-primary bg-surface-container border-none rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all duration-200" data-index="3" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-primary bg-surface-container border-none rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all duration-200" data-index="4" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-primary bg-surface-container border-none rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all duration-200" data-index="5" maxlength="1" pattern="\d*" type="text"/>
</div>
<!-- Hidden input to store full code -->
<input id="full-code" name="full-code" type="hidden"/>
<button class="w-full h-14 bg-primary text-on-primary font-label-caps uppercase tracking-widest rounded-lg shadow-md hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="verify-btn" type="submit">
<span>Verify Identity</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Meta Actions -->
<div class="mt-stack-xl w-full border-t border-outline-variant pt-stack-lg flex flex-col gap-4">
<div class="flex items-center justify-center gap-2 text-body-sm text-on-surface-variant">
<span>Didn't receive the code?</span>
<button class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 disabled:text-on-surface-variant/50 transition-colors" id="resend-btn">
            Resend Code <span class="font-code-sm ml-1 text-on-surface-variant/70" id="timer">(45s)</span>
</button>
</div>
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-high rounded-lg text-on-secondary-fixed-variant font-label-caps hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-lg">key</span>
<span>Use Backup Recovery Codes</span>
</button>
</div>
</div>
</div>
<!-- Trust Indicators -->
<div class="mt-stack-lg flex flex-wrap justify-center gap-x-gutter gap-y-stack-sm opacity-60">
<div class="flex items-center gap-1 text-body-sm">
<span class="material-symbols-outlined text-sm">lock</span>
<span>AES-256 Encryption</span>
</div>
<div class="flex items-center gap-1 text-body-sm">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span>SOC2 Type II Compliant</span>
</div>
</div>
<script>
    const inputs = document.querySelectorAll('.otp-input');
    const form = document.getElementById('otp-form');
    const resendBtn = document.getElementById('resend-btn');
    const timerEl = document.getElementById('timer');
    let timeLeft = 45;

    // Timer logic
    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        timerEl.textContent = '';
        resendBtn.disabled = false;
      } else {
        timerEl.textContent = `(${timeLeft}s)`;
        resendBtn.disabled = true;
      }
    }, 1000);

    // Auto-focus and backspace handling
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });

      // Paste handling
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const data = e.clipboardData.getData('text').slice(0, 6).split('');
        data.forEach((char, i) => {
          if (inputs[i]) {
            inputs[i].value = char;
            if (i < inputs.length - 1) inputs[i + 1].focus();
          }
        });
      });
    });

    // Form submission animation
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('verify-btn');
      const code = Array.from(inputs).map(i => i.value).join('');
      
      if (code.length === 6) {
        btn.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Authenticating...</span>
        `;
        btn.disabled = true;
        
        // Mock success
        setTimeout(() => {
          btn.classList.replace('bg-primary', 'bg-emerald-600');
          btn.innerHTML = `
            <span class="material-symbols-outlined">check_circle</span>
            <span>Success</span>
          `;
        }, 1500);
      }
    });

    // Initial focus
    window.addEventListener('load', () => inputs[0].focus());
  </script>
</div></main></body></html>
